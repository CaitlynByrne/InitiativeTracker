# dnsmasq configuration for Initiative Tracker local DNS
# This provides local DNS resolution for *.initiative domains

# Listen on all interfaces
# interface=eth0
# Also listen on any other interfaces (uncomment if needed)
# interface=wlan0
# Note: Commenting out interface= allows dnsmasq to listen on all available interfaces

# Never forward plain names (without a dot or domain part)
domain-needed

# Never forward addresses in the non-routed address spaces
bogus-priv

# Don't read /etc/resolv.conf or any other file
no-resolv

# Upstream DNS servers (Google DNS, change if desired)
server=8.8.8.8
server=8.8.4.4
# Uncomment to use your router as upstream DNS instead:
# server=192.168.1.1

# Cache size (default is 150)
cache-size=1000

# Log queries (comment out in production for performance)
log-queries
log-facility=/var/log/dnsmasq.log

# IMPORTANT: Replace 192.168.1.100 with your server's actual LAN IP address
# This tells dnsmasq to resolve these domains to your server's IP

# DM Console - dm.initiative
address=/dm.initiative/192.168.1.100

# Player Display - player.initiative
address=/player.initiative/192.168.1.100

# Wildcard - all *.initiative domains go to server
# (This catches any other subdomains you might add later)
address=/initiative/192.168.1.100

# Expand simple names (so "dm" becomes "dm.initiative")
expand-hosts
domain=initiative

# Don't use hosts file
no-hosts

# DHCP is disabled - this is DNS only
no-dhcp-interface=

# Bind to all interfaces (allows queries from any network device)
# bind-interfaces commented out to avoid interface binding issues on Pi
# bind-interfaces
