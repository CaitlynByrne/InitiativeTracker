version: '3.8'

services:
  # Redis for state persistence
  redis:
    image: redis:7-alpine
    container_name: initiative-redis
    # Port mapping removed to avoid conflicts with host Redis
    # Server can still access via internal Docker network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # WebSocket Server (Production)
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: initiative-server
    # Port removed - only accessible via nginx
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # DM Console Web Application (Production)
  dm-console:
    build:
      context: ../web/dm-console
      dockerfile: Dockerfile
    container_name: initiative-dm-console
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    depends_on:
      - server
    restart: unless-stopped

  # Pi Display Web Application (Production)
  pi-display:
    build:
      context: ../web/pi-display
      dockerfile: Dockerfile
    container_name: initiative-pi-display
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    depends_on:
      - server
    restart: unless-stopped

  # Nginx Reverse Proxy for DNS routing
  nginx:
    image: nginx:alpine
    container_name: initiative-nginx
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - dm-console
      - pi-display
    restart: unless-stopped

  # dnsmasq - Local DNS server for .initiative domain resolution
  dnsmasq:
    image: jpillora/dnsmasq
    container_name: initiative-dns
    ports:
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:53:53/tcp"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
    driver: local
